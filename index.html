<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rahul Adinath Gaikwad | Certificates</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f7f9;
            color: #17212b;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            padding: 21px 20px 53px;
            text-align: center;
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #102a43,
                    #164e63
                );
        }

        header h1 {
            font-size: clamp(22px, 3vw, 32px);
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 6px;
        }

        header p {
            font-size: clamp(13px, 1.5vw, 16px);
            line-height: 1.3;
            color: #d5edf2;
        }

        .header-line {
            width: 82px;
            height: 3px;
            background: #2dd4bf;
            border-radius: 20px;
            margin: 13px auto 0;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: min(760px, calc(100% - 30px));
            margin: -31px auto 28px;
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            background: #ffffff;

            border-radius: 16px;

            padding: 18px 18px;

            text-align: center;

            box-shadow:
                0 7px 22px
                rgba(16, 42, 67, 0.08);

            margin-bottom: 15px;

            animation: fadeDown 0.65s ease both;
        }

        .intro h2 {
            font-size: clamp(22px, 3vw, 29px);
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 6px;
            color: #17212b;
        }

        .intro p {
            color: #687782;
            font-size: clamp(13px, 1.5vw, 16px);
            line-height: 1.4;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .certificate-card {
            width: 100%;

            background: #ffffff;

            border: 1px solid #e5edef;

            border-radius: 15px;

            padding: 14px 16px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 6px 18px
                rgba(16, 42, 67, 0.07);

            opacity: 0;
            animation: cardAppear 0.65s ease forwards;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .certificate-card:nth-child(1) {
            animation-delay: 0.15s;
        }

        .certificate-card:nth-child(2) {
            animation-delay: 0.3s;
        }

        .certificate-card:nth-child(3) {
            animation-delay: 0.45s;
        }

        .certificate-card:nth-child(4) {
            animation-delay: 0.6s;
        }

        .certificate-card:hover {
            transform: translateY(-3px);

            border-color: #b8e5df;

            box-shadow:
                0 11px 25px
                rgba(16, 42, 67, 0.11);
        }


        /* =========================
           CARD TOP
        ========================= */

        .card-top {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        /* =========================
           ICON
        ========================= */

        .card-icon {
            width: 56px;
            min-width: 56px;

            height: 56px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #14b8a6
                );

            box-shadow:
                0 5px 12px
                rgba(20, 184, 166, 0.18);

            transition:
                transform 0.25s ease;
        }

        .certificate-card:hover .card-icon {
            transform: scale(1.05) rotate(-2deg);
        }

        .resume-icon {
            background:
                linear-gradient(
                    135deg,
                    #164e63,
                    #256d85
                );

            box-shadow:
                0 5px 12px
                rgba(22, 78, 99, 0.16);
        }


        /* =========================
           TEXT
        ========================= */

        .certificate-info {
            min-width: 0;
        }

        .badge {
            display: inline-block;

            padding: 4px 9px;

            margin-bottom: 4px;

            border-radius: 30px;

            background: #dff7f3;

            color: #0f766e;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .badge.document {
            background: #e3eef3;
            color: #164e63;
        }

        .certificate-info h3 {
            font-size: clamp(16px, 2vw, 20px);

            line-height: 1.2;

            font-weight: 700;

            margin-bottom: 4px;

            color: #17212b;
        }

        .issuer {
            color: #0f766e;

            font-size: 12px;

            line-height: 1.3;

            font-weight: 700;

            margin-bottom: 2px;
        }

        .certificate-date {
            color: #71808a;

            font-size: 11px;

            line-height: 1.3;
        }


        /* =========================
           BUTTON
        ========================= */

        .view-button {
            border: none;

            cursor: pointer;

            width: 140px;

            padding: 10px 12px;

            border-radius: 11px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #14b8a6
                );

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            box-shadow:
                0 5px 13px
                rgba(15, 118, 110, 0.17);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                filter 0.22s ease;
        }

        .view-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.05);

            box-shadow:
                0 8px 17px
                rgba(15, 118, 110, 0.23);
        }

        .view-button:active {
            transform: scale(0.97);
        }


        /* =========================
           PDF VIEWER
        ========================= */

        .viewer {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #101820;

            z-index: 99999;

            display: none;

            flex-direction: column;
        }

        .viewer.active {
            display: flex;
        }


        /* =========================
           VIEWER HEADER
        ========================= */

        .viewer-header {
            height: 54px;

            min-height: 54px;

            background: #102a43;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 13px 0 17px;

            color: white;
        }

        .viewer-title {
            font-size: 15px;

            font-weight: 700;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            width: 37px;

            height: 37px;

            border: 1px solid
                rgba(255, 255, 255, 0.18);

            border-radius: 50%;

            background: #173b55;

            color: #ffffff;

            font-size: 22px;

            font-weight: 400;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-button:hover {
            background: #0f766e;

            transform: scale(1.05);
        }

        .close-button:active {
            transform: scale(0.94);
        }


        /* =========================
           PDF FRAME
        ========================= */

        #pdfViewer {
            width: 100%;

            flex: 1;

            border: none;

            background: #20272d;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .container {
                width: calc(100% - 26px);
            }

            .certificate-card {
                grid-template-columns: 1fr;

                gap: 11px;
            }

            .view-button {
                width: 100%;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 20px 14px 50px;
            }

            header h1 {
                font-size: 22px;
            }

            header p {
                font-size: 13px;
            }

            .header-line {
                width: 75px;

                height: 3px;

                margin-top: 11px;
            }


            .container {
                width: calc(100% - 16px);

                margin-top: -28px;
            }


            .intro {
                padding: 17px 13px;

                border-radius: 15px;

                margin-bottom: 12px;
            }

            .intro h2 {
                font-size: 22px;
            }

            .intro p {
                font-size: 13px;
            }


            .cards {
                gap: 10px;
            }


            .certificate-card {
                padding: 13px 12px;

                border-radius: 15px;

                gap: 11px;
            }


            .card-top {
                gap: 10px;

                align-items: flex-start;
            }


            .card-icon {
                width: 52px;

                min-width: 52px;

                height: 52px;

                border-radius: 13px;

                font-size: 23px;
            }


            .badge {
                font-size: 8px;

                padding: 4px 8px;

                margin-bottom: 4px;
            }


            .certificate-info h3 {
                font-size: 16px;

                line-height: 1.2;
            }


            .issuer {
                font-size: 11px;
            }


            .certificate-date {
                font-size: 10px;
            }


            .view-button {
                width: 100%;

                padding: 10px;

                font-size: 12px;

                border-radius: 10px;
            }


            .viewer-header {
                height: 50px;

                min-height: 50px;

                padding:
                    0 9px 0 13px;
            }


            .viewer-title {
                font-size: 13px;
            }


            .close-button {
                width: 35px;

                height: 35px;

                font-size: 20px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .card-top {
                gap: 9px;
            }

            .card-icon {
                width: 49px;

                min-width: 49px;

                height: 49px;

                font-size: 22px;
            }

            .certificate-info h3 {
                font-size: 15px;
            }

            .issuer {
                font-size: 10px;
            }

            .certificate-date {
                font-size: 9px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            Rahul Adinath Gaikwad
        </h1>

        <p>
            Certifications &amp; Professional Development
        </p>

        <div class="header-line"></div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- INTRO -->

        <section class="intro">

            <h2>
                My Certifications
            </h2>

            <p>
                A collection of my professional
                learning achievements
            </p>

        </section>



        <!-- =========================
             CARDS
        ========================= -->

        <section class="cards">


            <!-- =========================
                 HTML CERTIFICATE
            ========================= -->

            <div class="certificate-card">

                <div class="card-top">

                    <div class="card-icon">
                        📜
                    </div>


                    <div class="certificate-info">

                        <span class="badge">
                            CERTIFICATE
                        </span>

                        <h3>
                            HTML – Certificate of Completion
                        </h3>

                        <div class="issuer">
                            A2Z IT HUB PVT LTD
                        </div>

                        <div class="certificate-date">
                            HTML · 17 May 2025
                        </div>

                    </div>

                </div>


                <button
                    class="view-button"
                    onclick="openPDF(
                        'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                        'HTML – Certificate'
                    )">

                    View Certificate →

                </button>

            </div>



            <!-- =========================
                 RESUME
            ========================= -->

            <div class="certificate-card">

                <div class="card-top">

                    <div class="card-icon resume-icon">
                        📄
                    </div>


                    <div class="certificate-info">

                        <span class="badge document">
                            DOCUMENT
                        </span>

                        <h3>
                            My Resume
                        </h3>

                        <div class="issuer">
                            Resume
                        </div>

                        <div class="certificate-date">
                            Updated Resume
                        </div>

                    </div>

                </div>


                <button
                    class="view-button"
                    onclick="openPDF(
                        'resume.pdf',
                        'My Resume'
                    )">

                    View Resume →

                </button>

            </div>


        </section>

    </main>



    <!-- =========================
         PDF VIEWER
    ========================= -->

    <div
        id="viewer"
        class="viewer">


        <div class="viewer-header">


            <div
                id="viewerTitle"
                class="viewer-title">

                Document

            </div>


            <button
                class="close-button"
                onclick="closePDF()"
                aria-label="Close PDF viewer">

                ×

            </button>

        </div>


        <iframe
            id="pdfViewer"
            src=""
            title="PDF Viewer">
        </iframe>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function openPDF(pdf, title) {

            document.getElementById("viewerTitle").innerText = title;

            const pdfURL =
                new URL(pdf, window.location.href).href;

            document.getElementById("pdfViewer").src =
                pdfURL;

            document.getElementById("viewer")
                .classList.add("active");

            document.body.style.overflow = "hidden";
        }


        function closePDF() {

            document.getElementById("viewer")
                .classList.remove("active");

            document.getElementById("pdfViewer").src = "";

            document.body.style.overflow = "";
        }


        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closePDF();
            }

        });

    </script>

</body>

</html>
