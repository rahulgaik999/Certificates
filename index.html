<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Adinath Gaikwad | Certificates</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3efe8;
            color: #252525;
        }

        /* =========================
           PAGE
        ========================= */
        .page {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
            padding: 15px 0 40px;
        }

        /* =========================
           TOP ONE-LINE CONTENT
        ========================= */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: 100%;
            padding: 18px 0;
            border-bottom: 1px solid #cfc6b8;
            text-align: center;
        }

        .hero-left {
            display: flex;
            align-items: center;
            padding-left: 14px;
            border-left: 3px solid #a27b32;
        }

        .hero-label {
            color: #a27b32;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .hero-right {
            display: flex;
            align-items: center;
            padding-left: 35px;
            border-left: 1px solid #d2c9bc;
        }

        .hero-right h1 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            font-size: 40px;
            line-height: 1;
            font-weight: 400;
            letter-spacing: -1px;
            color: #252525;
            white-space: nowrap;
            margin-left: 103px;
        }

        /* =========================
           CERTIFICATE SECTION
        ========================= */
        .certificate-section {
            display: block;
            padding-top: 40px;
        }

        /* =========================
           CERTIFICATE LIST
        ========================= */
        .certificate-list {
            border-top: 1px solid #cfc6b8;
        }

        .certificate-item {
            display: grid;
            grid-template-columns:
                55px minmax(0, 1fr) auto;
            align-items: center;
            gap: 20px;
            min-height: 145px;
            padding: 23px 5px 23px 0;
            border-bottom: 1px solid #cfc6b8;
            transition:
                background .25s ease,
                padding .25s ease;
        }

        .certificate-item:hover {
            background: #ebe5db;
            padding-left: 15px;
            padding-right: 15px;
        }

        .certificate-number {
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            color: #b4a99a;
            font-size: 28px;
        }

        .certificate-info {
            min-width: 0;
        }

        .certificate-type {
            display: inline-block;
            margin-bottom: 7px;
            color: #a27b32;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .certificate-info h3 {
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            font-size:
                clamp(19px, 2.3vw, 26px);
            font-weight: 400;
            line-height: 1.2;
        }

        .certificate-info p {
            margin-top: 7px;
            color: #766e63;
            font-size: 11px;
        }

        .certificate-date {
            margin-top: 6px;
            color: #9a9185;
            font-size: 9px;
        }

        /* =========================
           BUTTON
        ========================= */
        .view-button {
            border: 1px solid #252525;
            background: transparent;
            color: #252525;
            padding: 11px 16px;
            border-radius: 0;
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
            white-space: nowrap;
            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }

        .view-button:hover {
            background: #252525;
            color: white;
            transform: translateY(-2px);
        }

        /* =========================
           PDF VIEWER
        ========================= */
        .viewer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #171717;
            z-index: 99999;
            display: none;
            flex-direction: column;
        }

        .viewer.active {
            display: flex;
        }

        .viewer-header {
            height: 58px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: #252525;
            color: white;
        }

        .viewer-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
        }

        .close-button {
            width: 38px;
            height: 38px;
            border: 1px solid #555;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            background: #a27b32;
            border-color: #a27b32;
        }

        #pdfViewer {
            width: 100%;
            flex: 1;
            border: none;
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 700px) {

            .page {
                width: calc(100% - 22px);
                padding-top: 10px;
            }

            .hero {
                gap: 15px;
                padding: 15px 0;
            }

            .hero-left {
                padding-left: 10px;
            }

            .hero-label {
                font-size: 9px;
                letter-spacing: 1px;
            }

            .hero-right {
                padding-left: 15px;
            }

            .hero-right h1 {
                font-size: 25px;
                letter-spacing: -.5px;
            }

            .certificate-section {
                padding-top: 35px;
            }

            .certificate-item {
                grid-template-columns:
                    32px 1fr;
                gap: 10px;
                padding: 20px 0;
            }

            .certificate-number {
                font-size: 20px;
            }

            .certificate-info h3 {
                font-size: 19px;
            }

            .certificate-info p {
                font-size: 10px;
            }

            .certificate-date {
                font-size: 8px;
            }

            .view-button {
                grid-column: 2;
                justify-self: start;
                margin-top: 2px;
            }
        }

        @media (max-width: 430px) {

            .hero {
                gap: 10px;
            }

            .hero-label {
                font-size: 7px;
                letter-spacing: .8px;
            }

            .hero-right {
                padding-left: 9px;
            }

            .hero-right h1 {
                font-size: 20px;
                letter-spacing: -.3px;
            }
        }

        @media (max-width: 380px) {

            .hero-label {
                font-size: 6.5px;
            }

            .hero-right h1 {
                font-size: 18px;
            }

            .certificate-info h3 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- TOP ONE-LINE CONTENT -->
        <section class="hero">

            <div class="hero-left">
                <span class="hero-label">
                    Learning Archive
                </span>
            </div>

            <div class="hero-right">
                <h1>
                    Certificates &amp; Credentials
                </h1>
            </div>

        </section>


        <!-- CERTIFICATES -->
        <section class="certificate-section">

            <div class="certificate-list">

                <!-- CERTIFICATE -->
                <article class="certificate-item">

                    <div class="certificate-number">
                        01
                    </div>

                    <div class="certificate-info">

                        <span class="certificate-type">
                            Certificate
                        </span>

                        <h3>
                            HTML – Certificate of Completion
                        </h3>

                        <p>
                            A2Z IT HUB PVT LTD
                        </p>

                        <div class="certificate-date">
                            HTML · 17 May 2025
                        </div>

                    </div>

                    <button
                        class="view-button"
                        onclick="openPDF(
                            'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                            'HTML – Certificate'
                        )">
                        View Certificate
                    </button>

                </article>


                <!-- RESUME -->
                <article class="certificate-item">

                    <div class="certificate-number">
                        02
                    </div>

                    <div class="certificate-info">

                        <span class="certificate-type">
                            Document
                        </span>

                        <h3>
                            My Resume
                        </h3>

                        <p>
                            Professional Resume
                        </p>

                        <div class="certificate-date">
                            Updated Resume
                        </div>

                    </div>

                    <button
                        class="view-button"
                        onclick="openPDF(
                            'resume.pdf',
                            'My Resume'
                        )">
                        View Resume
                    </button>

                </article>

            </div>

        </section>

    </div>


    <!-- PDF VIEWER -->
    <div
        id="viewer"
        class="viewer">

        <div class="viewer-header">

            <div
                id="viewerTitle"
                class="viewer-title">
                Document
            </div>

            <button
                class="close-button"
                onclick="closePDF()"
                aria-label="Close PDF viewer">
                ×
            </button>

        </div>

        <iframe
            id="pdfViewer"
            src=""
            title="PDF Viewer">
        </iframe>

    </div>


    <script>

        function openPDF(pdf, title) {

            document.getElementById("viewerTitle")
                .innerText = title;

            const pdfURL =
                new URL(
                    pdf,
                    window.location.href
                ).href;

            document.getElementById("pdfViewer")
                .src = pdfURL;

            document.getElementById("viewer")
                .classList.add("active");

            document.body.style.overflow = "hidden";
        }


        function closePDF() {

            document.getElementById("viewer")
                .classList.remove("active");

            document.getElementById("pdfViewer")
                .src = "";

            document.body.style.overflow = "";
        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {
                    closePDF();
                }

            }
        );

    </script>

</body>

</html>
