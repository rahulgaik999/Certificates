<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahul Gaikwad | Certificates</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8ed;
            color: #3b2414;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            padding: 24px 20px 52px;

            text-align: center;
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #9b3d00,
                    #e87500,
                    #f5b400
                );
        }

        header h1 {
            font-size: clamp(24px, 3vw, 34px);
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 7px;
        }

        header p {
            font-size: clamp(14px, 1.5vw, 17px);
            line-height: 1.3;
        }

        .header-line {
            width: 90px;
            height: 4px;

            background: #ffe082;

            border-radius: 20px;

            margin: 14px auto 0;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: min(720px, calc(100% - 32px));

            margin: -28px auto 28px;
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            background: #ffffff;

            border-radius: 17px;

            padding: 19px 18px;

            text-align: center;

            box-shadow:
                0 8px 24px
                rgba(145, 77, 20, 0.10);

            margin-bottom: 15px;
        }

        .intro h2 {
            font-size: clamp(23px, 2.5vw, 29px);

            line-height: 1.15;

            font-weight: 700;

            margin-bottom: 6px;

            color: #6b2f0b;
        }

        .intro p {
            color: #8a6a55;

            font-size: 14px;

            line-height: 1.4;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .certificate-card {
            width: 100%;

            background: #ffffff;

            border-radius: 17px;

            padding: 15px 17px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            align-items: center;

            gap: 15px;

            box-shadow:
                0 8px 24px
                rgba(145, 77, 20, 0.10);

            border-left: 4px solid #e58a00;
        }


        /* =========================
           CARD CONTENT
        ========================= */

        .card-top {
            display: flex;
            align-items: center;

            gap: 14px;

            min-width: 0;
        }


        /* =========================
           ICON
        ========================= */

        .card-icon {
            width: 58px;
            min-width: 58px;

            height: 58px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;

            background:
                linear-gradient(
                    135deg,
                    #e87500,
                    #f5b400
                );

            box-shadow:
                0 5px 12px
                rgba(220, 116, 0, 0.18);
        }


        /* =========================
           TEXT
        ========================= */

        .certificate-info {
            min-width: 0;
        }

        .badge {
            display: inline-block;

            padding: 4px 10px;

            margin-bottom: 5px;

            border-radius: 30px;

            background: #fff0cc;

            color: #b85b00;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 0.4px;
        }

        .certificate-info h3 {
            font-size: clamp(17px, 2vw, 21px);

            line-height: 1.2;

            font-weight: 700;

            margin-bottom: 5px;

            color: #4a2817;
        }

        .issuer {
            color: #c45d00;

            font-size: 12px;

            line-height: 1.3;

            font-weight: 700;

            margin-bottom: 3px;
        }

        .certificate-date {
            color: #8a6a55;

            font-size: 11px;

            line-height: 1.3;
        }


        /* =========================
           VIEW BUTTON
        ========================= */

        .view-button {
            border: none;

            cursor: pointer;

            width: 140px;

            padding: 10px 12px;

            border-radius: 11px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #d96500,
                    #f0a900
                );

            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            box-shadow:
                0 6px 14px
                rgba(206, 104, 0, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .view-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 18px
                rgba(206, 104, 0, 0.25);
        }

        .view-button:active {
            transform: translateY(0);
        }


        /* =========================
           PDF VIEWER
        ========================= */

        .viewer {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #242424;

            z-index: 99999;

            display: none;

            flex-direction: column;
        }

        .viewer.active {
            display: flex;
        }


        /* =========================
           VIEWER HEADER
        ========================= */

        .viewer-header {
            height: 52px;
            min-height: 52px;

            background: #4a260d;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 14px 0 18px;

            color: white;
        }

        .viewer-title {
            font-size: 15px;

            font-weight: 700;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            width: 36px;
            height: 36px;

            border: 1px solid
                rgba(255, 255, 255, 0.20);

            border-radius: 50%;

            background: #5f3517;

            color: white;

            font-size: 21px;

            font-weight: 400;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-button:hover {
            background: #75451f;

            transform: scale(1.05);
        }


        /* =========================
           PDF FRAME
        ========================= */

        #pdfFrame {
            width: 100%;

            flex: 1;

            border: none;

            background: #242424;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 800px) {

            .container {
                width: calc(100% - 26px);
            }

            .certificate-card {
                grid-template-columns: 1fr;

                gap: 12px;
            }

            .view-button {
                width: 100%;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 20px 12px 46px;
            }

            header h1 {
                font-size: 21px;
            }

            header p {
                font-size: 13px;
            }

            .header-line {
                width: 75px;

                height: 3px;

                margin-top: 12px;
            }


            .container {
                width: calc(100% - 16px);

                margin-top: -25px;
            }


            .intro {
                padding: 17px 12px;

                border-radius: 16px;

                margin-bottom: 12px;
            }

            .intro h2 {
                font-size: 21px;
            }

            .intro p {
                font-size: 13px;
            }


            .cards {
                gap: 12px;
            }


            .certificate-card {
                padding: 14px 12px;

                border-radius: 16px;

                gap: 11px;

                border-left-width: 3px;
            }


            .card-top {
                gap: 11px;

                align-items: flex-start;
            }


            .card-icon {
                width: 52px;

                min-width: 52px;

                height: 52px;

                border-radius: 13px;

                font-size: 23px;
            }


            .badge {
                font-size: 8px;

                padding: 4px 8px;

                margin-bottom: 4px;
            }


            .certificate-info h3 {
                font-size: 16px;

                line-height: 1.2;
            }


            .issuer {
                font-size: 11px;
            }


            .certificate-date {
                font-size: 10px;
            }


            .view-button {
                width: 100%;

                padding: 10px;

                font-size: 12px;

                border-radius: 10px;
            }


            .viewer-header {
                height: 50px;

                min-height: 50px;

                padding:
                    0 10px 0 14px;
            }


            .viewer-title {
                font-size: 14px;
            }


            .close-button {
                width: 34px;

                height: 34px;

                font-size: 20px;
            }
        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            header h1 {
                font-size: 20px;
            }

            .intro h2 {
                font-size: 20px;
            }

            .certificate-info h3 {
                font-size: 15px;
            }

            .issuer {
                font-size: 10px;
            }

            .certificate-date {
                font-size: 9px;
            }

            .card-icon {
                width: 48px;

                min-width: 48px;

                height: 48px;

                font-size: 21px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            Rahul Gaikwad
        </h1>

        <p>
            Certifications &amp; Professional Development
        </p>

        <div class="header-line"></div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- INTRO -->

        <section class="intro">

            <h2>
                My Certifications
            </h2>

            <p>
                My professional learning achievements
            </p>

        </section>


        <!-- =========================
             CERTIFICATE
        ========================= -->

        <section class="cards">

            <div class="certificate-card">

                <div class="card-top">

                    <div class="card-icon">
                        📜
                    </div>


                    <div class="certificate-info">

                        <span class="badge">
                            CERTIFICATE
                        </span>

                        <h3>
                            HTML – Certificate of Completion
                        </h3>

                        <div class="issuer">
                            A2Z IT HUB PVT LTD
                        </div>

                        <div class="certificate-date">
                            HTML · 17 May 2025
                        </div>

                    </div>

                </div>


                <button
                    class="view-button"
                    onclick="openPDF(
                        'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                        'HTML – Certificate'
                    )">

                    View Certificate →

                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         PDF VIEWER
    ========================= -->

    <div
        id="viewer"
        class="viewer">

        <div class="viewer-header">

            <div
                id="viewerTitle"
                class="viewer-title">

                Certificate

            </div>


            <button
                class="close-button"
                onclick="closePDF()"
                aria-label="Close PDF viewer">

                ×

            </button>

        </div>


        <iframe
            id="pdfFrame"
            src=""
            title="Certificate PDF Viewer">
        </iframe>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function openPDF(pdf, title) {

            const viewer =
                document.getElementById("viewer");

            const frame =
                document.getElementById("pdfFrame");

            const titleElement =
                document.getElementById("viewerTitle");


            titleElement.innerText = title;


            const pdfURL =
                new URL(
                    pdf,
                    window.location.href
                ).href;


            frame.src =
                pdfURL +
                "#toolbar=1&navpanes=0&scrollbar=1";


            viewer.classList.add("active");


            document.body.style.overflow =
                "hidden";
        }


        function closePDF() {

            const viewer =
                document.getElementById("viewer");

            const frame =
                document.getElementById("pdfFrame");


            viewer.classList.remove("active");


            frame.src = "";


            document.body.style.overflow =
                "auto";
        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closePDF();

                }

            }
        );

    </script>


</body>

</html>
