<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahul Gaikwad | Certificates</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8ed;
            color: #3b2414;
            overflow-x: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            padding: 38px 20px 82px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #a83d00,
                    #e66f00,
                    #f7b500
                );
        }

        header h1 {
            font-size: clamp(34px, 4vw, 50px);
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: clamp(18px, 2vw, 24px);
            line-height: 1.3;
        }

        .header-line {
            width: 145px;
            height: 6px;

            border-radius: 20px;

            background: #ffe082;

            margin: 22px auto 0;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: min(900px, calc(100% - 32px));

            margin: -40px auto 40px;
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            background: #ffffff;

            border-radius: 22px;

            padding: 31px 24px;

            text-align: center;

            margin-bottom: 24px;

            box-shadow:
                0 10px 28px
                rgba(125, 70, 20, 0.10);
        }

        .intro h2 {
            color: #66300d;

            font-size: clamp(30px, 3.5vw, 42px);

            line-height: 1.1;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .intro p {
            color: #8c6b55;

            font-size: clamp(15px, 1.7vw, 20px);

            line-height: 1.4;
        }


        /* =========================
           CERTIFICATE CARD
        ========================= */

        .certificate-card {
            width: 100%;

            background: #ffffff;

            border-radius: 22px;

            padding: 25px 28px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            border-left: 5px solid #e87900;

            box-shadow:
                0 10px 28px
                rgba(125, 70, 20, 0.10);
        }


        /* =========================
           LEFT SIDE
        ========================= */

        .card-left {
            display: flex;

            align-items: center;

            gap: 20px;

            min-width: 0;
        }


        /* =========================
           ICON
        ========================= */

        .card-icon {
            width: 82px;
            min-width: 82px;

            height: 82px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #f07800,
                    #f7b500
                );

            box-shadow:
                0 9px 18px
                rgba(220, 110, 0, 0.20);
        }


        /* =========================
           CERTIFICATE INFO
        ========================= */

        .certificate-info {
            min-width: 0;
        }

        .badge {
            display: inline-block;

            padding: 6px 14px;

            border-radius: 30px;

            background: #fff0c7;

            color: #c45b00;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.4px;

            margin-bottom: 7px;
        }

        .certificate-info h3 {
            color: #482713;

            font-size: clamp(21px, 2.5vw, 29px);

            line-height: 1.2;

            font-weight: 700;

            margin-bottom: 7px;
        }

        .issuer {
            color: #d15e00;

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 4px;
        }

        .certificate-date {
            color: #8b6c57;

            font-size: 13px;
        }


        /* =========================
           BUTTON
        ========================= */

        .view-button {
            flex-shrink: 0;

            width: 175px;

            padding: 14px 16px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #e46d00,
                    #f5b400
                );

            font-size: 14px;

            font-weight: 700;

            white-space: nowrap;

            box-shadow:
                0 8px 18px
                rgba(215, 108, 0, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .view-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 22px
                rgba(215, 108, 0, 0.28);
        }


        /* =========================
           PDF VIEWER
        ========================= */

        .viewer {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #20252f;

            z-index: 99999;

            display: none;

            flex-direction: column;
        }

        .viewer.active {
            display: flex;
        }


        /* =========================
           PDF VIEWER HEADER
        ========================= */

        .viewer-header {
            height: 52px;
            min-height: 52px;

            background: #0b1b32;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 14px 0 18px;
        }

        .viewer-title {
            color: white;

            font-size: 15px;

            font-weight: 700;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-button {
            width: 36px;
            height: 36px;

            border: 1px solid
                rgba(255,255,255,0.20);

            border-radius: 50%;

            background: #1e293b;

            color: white;

            font-size: 22px;

            font-weight: 400;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .close-button:hover {
            background: #334155;
        }


        /* =========================
           PDF
        ========================= */

        #pdfFrame {
            width: 100%;

            height: 100%;

            flex: 1;

            border: none;

            background: #20252f;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            .container {
                width: calc(100% - 28px);
            }

            .certificate-card {
                padding: 23px;
                gap: 20px;
            }

            .card-icon {
                width: 72px;
                min-width: 72px;

                height: 72px;

                font-size: 33px;
            }

            .view-button {
                width: 160px;

                padding: 13px;

                font-size: 13px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            header {
                padding: 27px 15px 68px;
            }

            header h1 {
                font-size: 29px;
            }

            header p {
                font-size: 16px;
            }

            .header-line {
                width: 95px;

                height: 4px;

                margin-top: 17px;
            }


            .container {
                width: calc(100% - 18px);

                margin: -35px auto 25px;
            }


            .intro {
                padding: 23px 14px;

                border-radius: 18px;

                margin-bottom: 16px;
            }

            .intro h2 {
                font-size: 27px;

                margin-bottom: 8px;
            }

            .intro p {
                font-size: 14px;
            }


            .certificate-card {
                padding: 17px 13px;

                border-radius: 18px;

                border-left-width: 4px;

                flex-direction: column;

                align-items: stretch;

                gap: 14px;
            }


            .card-left {
                gap: 12px;

                align-items: flex-start;
            }


            .card-icon {
                width: 60px;
                min-width: 60px;

                height: 60px;

                border-radius: 15px;

                font-size: 28px;
            }


            .badge {
                font-size: 9px;

                padding: 5px 9px;

                margin-bottom: 5px;
            }


            .certificate-info h3 {
                font-size: 18px;

                line-height: 1.2;

                margin-bottom: 6px;
            }


            .issuer {
                font-size: 12px;
            }


            .certificate-date {
                font-size: 10px;
            }


            .view-button {
                width: 100%;

                padding: 11px;

                border-radius: 11px;

                font-size: 13px;
            }


            .viewer-header {
                height: 50px;

                min-height: 50px;

                padding: 0 10px 0 14px;
            }


            .viewer-title {
                font-size: 14px;
            }


            .close-button {
                width: 34px;

                height: 34px;

                font-size: 20px;
            }
        }


        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 380px) {

            header h1 {
                font-size: 27px;
            }

            header p {
                font-size: 14px;
            }

            .intro h2 {
                font-size: 25px;
            }

            .certificate-info h3 {
                font-size: 17px;
            }

            .card-icon {
                width: 56px;
                min-width: 56px;

                height: 56px;

                font-size: 25px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            Rahul Gaikwad
        </h1>

        <p>
            Certifications &amp; Professional Development
        </p>

        <div class="header-line"></div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- INTRO -->

        <section class="intro">

            <h2>
                My Certifications
            </h2>

            <p>
                A collection of my professional learning achievements
            </p>

        </section>


        <!-- =========================
             CERTIFICATE CARD
        ========================= -->

        <section>

            <div class="certificate-card">


                <div class="card-left">


                    <div class="card-icon">
                        📜
                    </div>


                    <div class="certificate-info">

                        <span class="badge">
                            CERTIFICATE
                        </span>

                        <h3>
                            HTML – Certificate of Completion
                        </h3>

                        <div class="issuer">
                            A2Z IT HUB PVT LTD
                        </div>

                        <div class="certificate-date">
                            HTML · 17 May 2025
                        </div>

                    </div>


                </div>


                <button
                    class="view-button"
                    onclick="openPDF(
                        'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                        'HTML – Certificate'
                    )">

                    View Certificate →

                </button>


            </div>

        </section>


    </main>


    <!-- =========================
         PDF VIEWER
    ========================= -->

    <div
        id="viewer"
        class="viewer">


        <div class="viewer-header">

            <div
                id="viewerTitle"
                class="viewer-title">

                HTML – Certificate

            </div>


            <button
                class="close-button"
                onclick="closePDF()"
                aria-label="Close PDF">

                ×

            </button>

        </div>


        <iframe
            id="pdfFrame"
            src=""
            title="PDF Viewer">
        </iframe>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function openPDF(pdf, title) {

            const viewer =
                document.getElementById("viewer");

            const frame =
                document.getElementById("pdfFrame");

            const titleElement =
                document.getElementById("viewerTitle");


            titleElement.innerText = title;


            const pdfURL =
                new URL(
                    pdf,
                    window.location.href
                ).href;


            frame.src =
                pdfURL +
                "#toolbar=1&navpanes=0&scrollbar=1";


            viewer.classList.add("active");


            document.body.style.overflow =
                "hidden";
        }


        function closePDF() {

            const viewer =
                document.getElementById("viewer");

            const frame =
                document.getElementById("pdfFrame");


            viewer.classList.remove("active");


            frame.src = "";


            document.body.style.overflow =
                "auto";
        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closePDF();

                }

            }
        );

    </script>


</body>
</html>
