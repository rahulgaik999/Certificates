<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Certifications</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            color: #cbd5e1;
            font-size: 17px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #667085;
        }

        .certificates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .certificate {
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .certificate h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .certificate .issuer {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .certificate p {
            color: #667085;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 60px;
            background: #111827;
            color: #cbd5e1;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Certifications</h1>
        <p>Technical Certifications & Professional Achievements</p>
    </header>

    <main class="container">

        <div class="title">
            <h2>My Certificates</h2>
            <p>A collection of my professional certifications.</p>
        </div>

        <div class="certificates">

            <!-- My Certificate -->
            <div class="certificate">

                <h3>YOUR CERTIFICATE NAME</h3>

                <div class="issuer">
                    ISSUING ORGANIZATION
                </div>

                <p>
                    Certificate details will be added here.
                </p>

                <a class="button"
                  href="Rahul-Adinath-Gaikwad-HTML-Certificate.pdf"
                   target="_blank">
                    View Certificate
                </a>

            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 My Certification Portfolio</p>
    </footer>

</body>
</html>
