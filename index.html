<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Rahul Adinath Gaikwad | Certificates</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef4ff;
    color: #102a56;
    width: 100%;
    overflow-x: hidden;
}


/* =========================
   HEADER
========================= */

header {
    width: 100%;
    padding: 45px 20px 90px;
    text-align: center;
    color: white;

    background:
        linear-gradient(135deg, #3928a8, #1268e8);

    position: relative;
}

header h1 {
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 800;
    margin-bottom: 10px;
}

header p {
    font-size: clamp(16px, 4vw, 24px);
    opacity: 0.95;
}

.header-line {
    width: 150px;
    height: 6px;
    background: #4db7ff;
    border-radius: 20px;
    margin: 25px auto 0;
}


/* =========================
   MAIN
========================= */

.container {
    width: min(900px, calc(100% - 28px));
    margin: -55px auto 50px;
    position: relative;
}


/* =========================
   INTRO
========================= */

.intro {
    background: white;
    border-radius: 28px;
    padding: 38px 25px;
    text-align: center;

    box-shadow: 0 15px 45px rgba(35, 75, 140, 0.12);

    margin-bottom: 30px;
}

.intro h2 {
    font-size: clamp(30px, 8vw, 48px);
    margin-bottom: 12px;
}

.intro p {
    color: #65758b;
    font-size: clamp(17px, 4.5vw, 24px);
    line-height: 1.4;
}


/* =========================
   CARDS
========================= */

.cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.certificate-card {
    width: 100%;
    background: white;
    border-radius: 28px;
    padding: 28px;

    box-shadow: 0 15px 45px rgba(35, 75, 140, 0.12);

    display: flex;
    align-items: center;
    gap: 25px;
}


/* ICON */

.card-icon {
    width: 105px;
    min-width: 105px;
    height: 105px;

    border-radius: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;

    background: linear-gradient(135deg, #245bea, #5138e8);
}

.resume-icon {
    background: linear-gradient(135deg, #00a878, #04b99c);
}


/* INFORMATION */

.certificate-info {
    flex: 1;
    min-width: 0;
}

.badge {
    display: inline-block;

    padding: 8px 18px;
    border-radius: 30px;

    background: #dcecff;
    color: #0864d9;

    font-weight: 700;
    font-size: 14px;

    margin-bottom: 12px;
}

.badge.document {
    background: #d4faed;
    color: #087d61;
}

.certificate-info h3 {
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.2;
    margin-bottom: 12px;
}

.issuer {
    color: #0864d9;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
}

.certificate-date {
    color: #65758b;
    font-size: 17px;
}


/* =========================
   BUTTON
========================= */

.view-button {
    border: none;
    cursor: pointer;

    min-width: 190px;

    padding: 17px 24px;

    border-radius: 18px;

    color: white;
    font-size: 17px;
    font-weight: 700;

    background: linear-gradient(135deg, #1268e8, #5239e9);

    box-shadow: 0 10px 25px rgba(40, 80, 220, 0.22);

    transition: 0.2s;
}

.view-button:hover {
    transform: translateY(-2px);
}


/* =========================
   FULL SCREEN VIEWER
========================= */

.viewer {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #151820;

    z-index: 99999;

    display: none;

    flex-direction: column;
}

.viewer.active {
    display: flex;
}


/* VIEWER HEADER */

.viewer-header {
    height: 70px;
    min-height: 70px;

    background: #0b1b32;

    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;
}

.viewer-title {
    font-size: 20px;
    font-weight: 700;
}

.close-button {
    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: #ff3040;
    color: white;

    font-size: 32px;
    line-height: 1;

    cursor: pointer;
}


/* PDF AREA */

#pdfViewer {
    flex: 1;

    width: 100%;
    height: calc(100vh - 70px);

    border: none;

    background: #202228;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    header {
        padding: 30px 16px 75px;
    }

    .container {
        width: calc(100% - 20px);
        margin-top: -45px;
    }

    .intro {
        padding: 30px 18px;
        border-radius: 24px;
    }

    .cards {
        gap: 18px;
    }

    .certificate-card {
        padding: 22px 18px;

        display: flex;
        flex-direction: column;

        align-items: stretch;

        gap: 18px;

        border-radius: 24px;
    }

    .card-top {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .card-icon {
        width: 75px;
        min-width: 75px;
        height: 75px;

        border-radius: 20px;

        font-size: 34px;
    }

    .certificate-info h3 {
        font-size: 24px;
    }

    .issuer {
        font-size: 16px;
    }

    .certificate-date {
        font-size: 15px;
    }

    .view-button {
        width: 100%;
        min-width: 0;

        padding: 16px;

        font-size: 16px;
    }

    .viewer-header {
        height: 64px;
        min-height: 64px;

        padding: 0 12px 0 16px;
    }

    .viewer-title {
        font-size: 17px;
    }

    .close-button {
        width: 46px;
        height: 46px;

        font-size: 28px;
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Rahul Adinath Gaikwad</h1>

    <p>
        Certifications & Professional Development
    </p>

    <div class="header-line"></div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <section class="intro">

        <h2>My Certifications</h2>

        <p>
            A collection of my professional
            learning achievements
        </p>

    </section>



    <section class="cards">


        <!-- =========================
             HTML CERTIFICATE
        ========================= -->

        <div class="certificate-card">

            <div class="card-top">

                <div class="card-icon">
                    📜
                </div>

                <div class="certificate-info">

                    <span class="badge">
                        CERTIFICATE
                    </span>

                    <h3>
                        HTML – Certificate of Completion
                    </h3>

                    <div class="issuer">
                        A2Z IT HUB PVT LTD
                    </div>

                    <div class="certificate-date">
                        HTML · 17 May 2025
                    </div>

                </div>

            </div>


            <button
                class="view-button"
                onclick="openPDF(
                    'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                    'HTML – Certificate'
                )">

                View Certificate →

            </button>

        </div>



        <!-- =========================
             RESUME
        ========================= -->

        <div class="certificate-card">

            <div class="card-top">

                <div class="card-icon resume-icon">
                    📄
                </div>

                <div class="certificate-info">

                    <span class="badge document">
                        DOCUMENT
                    </span>

                    <h3>
                        My Resume
                    </h3>

                    <div class="issuer">
                        Resume
                    </div>

                    <div class="certificate-date">
                        Updated Resume
                    </div>

                </div>

            </div>


            <button
                class="view-button"
                onclick="openPDF(
                    'resume.pdf',
                    'My Resume'
                )">

                View Resume →

            </button>

        </div>


    </section>

</main>



<!-- =========================
     PDF VIEWER
========================= -->

<div id="viewer" class="viewer">

    <div class="viewer-header">

        <div
            id="viewerTitle"
            class="viewer-title">
            Document
        </div>


        <button
            class="close-button"
            onclick="closePDF()">

            ×

        </button>

    </div>


    <iframe
        id="pdfViewer"
        src=""
        title="PDF Viewer">
    </iframe>

</div>



<script>

/* =========================
   OPEN PDF
========================= */

function openPDF(pdf, title) {

    document.getElementById("viewerTitle").innerText = title;

    /*
       Create the full GitHub Pages PDF URL.
    */

    const pdfURL =
        new URL(pdf, window.location.href).href;


    /*
       Google Docs embedded viewer
       prevents Android Chrome from showing
       the ugly "resume.pdf / Open" fallback.
    */

    const viewerURL =
        "https://docs.google.com/gview?embedded=1&url="
        + encodeURIComponent(pdfURL);


    document.getElementById("pdfViewer").src = viewerURL;

    document.getElementById("viewer").classList.add("active");

    document.body.style.overflow = "hidden";
}



/* =========================
   CLOSE PDF
========================= */

function closePDF() {

    document.getElementById("viewer").classList.remove("active");

    document.getElementById("pdfViewer").src = "";

    document.body.style.overflow = "auto";
}



/* =========================
   ESC KEY
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closePDF();

    }

});

</script>


</body>
</html>
