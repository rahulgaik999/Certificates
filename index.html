<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Rahul Adinath Gaikwad | Certificates</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef4ff;
    color: #102a56;
}


/* =========================
   HEADER
========================= */

header {
    width: 100%;
    padding: 28px 20px 65px;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #3d2bb3, #1268e8);
}

header h1 {
    font-size: clamp(24px, 3.5vw, 38px);
    line-height: 1.15;
    font-weight: 700;
    margin-bottom: 8px;
}

header p {
    font-size: clamp(15px, 1.8vw, 19px);
    line-height: 1.3;
}

.header-line {
    width: 120px;
    height: 5px;
    background: #4db7ff;
    border-radius: 20px;
    margin: 18px auto 0;
}


/* =========================
   MAIN
========================= */

.container {
    width: min(950px, calc(100% - 32px));
    margin: -38px auto 40px;
}


/* =========================
   INTRO
========================= */

.intro {
    background: #ffffff;
    border-radius: 23px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 10px 28px rgba(35, 75, 140, 0.10);
    margin-bottom: 22px;
}

.intro h2 {
    font-size: clamp(27px, 3.5vw, 40px);
    line-height: 1.15;
    font-weight: 700;
    margin-bottom: 9px;
}

.intro p {
    color: #64748b;
    font-size: clamp(15px, 1.8vw, 20px);
    line-height: 1.4;
}


/* =========================
   CARDS
========================= */

.cards {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.certificate-card {
    width: 100%;
    background: #ffffff;
    border-radius: 22px;
    padding: 22px 25px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 24px;

    box-shadow: 0 10px 28px rgba(35, 75, 140, 0.10);
}


/* =========================
   CARD
========================= */

.card-top {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
}

.card-icon {
    width: 78px;
    min-width: 78px;
    height: 78px;

    border-radius: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;

    background: linear-gradient(135deg, #2859e8, #5438e8);
}

.resume-icon {
    background: linear-gradient(135deg, #00a878, #05b99c);
}


/* =========================
   TEXT
========================= */

.certificate-info {
    min-width: 0;
}

.badge {
    display: inline-block;

    padding: 6px 14px;
    margin-bottom: 7px;

    border-radius: 30px;

    background: #dcecff;
    color: #0864d9;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
}

.badge.document {
    background: #d4faed;
    color: #087d61;
}

.certificate-info h3 {
    font-size: clamp(20px, 2.2vw, 27px);
    line-height: 1.2;
    font-weight: 700;
    margin-bottom: 7px;
}

.issuer {
    color: #0864d9;
    font-size: 15px;
    line-height: 1.3;
    font-weight: 700;
    margin-bottom: 5px;
}

.certificate-date {
    color: #64748b;
    font-size: 14px;
    line-height: 1.3;
}


/* =========================
   BUTTON
========================= */

.view-button {
    border: none;
    cursor: pointer;

    width: 185px;

    padding: 14px 17px;

    border-radius: 15px;

    color: white;
    background: linear-gradient(135deg, #1268e8, #5239e9);

    font-size: 15px;
    font-weight: 700;

    white-space: nowrap;

    box-shadow: 0 8px 18px rgba(40, 80, 220, 0.18);

    transition: transform 0.2s ease;
}

.view-button:hover {
    transform: translateY(-2px);
}


/* =========================
   PDF VIEWER
========================= */

.viewer {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #151820;

    z-index: 99999;

    display: none;
    flex-direction: column;
}

.viewer.active {
    display: flex;
}

.viewer-header {
    height: 64px;
    min-height: 64px;

    background: #0b1b32;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    color: white;
}

.viewer-title {
    font-size: 18px;
    font-weight: 700;
}

.close-button {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: #ff3040;
    color: white;

    font-size: 28px;

    cursor: pointer;
}

#pdfViewer {
    width: 100%;
    flex: 1;
    border: none;
    background: #202228;
}


/* =========================
   TABLET
========================= */

@media (max-width: 800px) {

    .container {
        width: calc(100% - 26px);
    }

    .certificate-card {
        grid-template-columns: 1fr;
        gap: 17px;
    }

    .view-button {
        width: 100%;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding: 24px 14px 58px;
    }

    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 15px;
    }

    .header-line {
        width: 100px;
        height: 4px;
        margin-top: 15px;
    }

    .container {
        width: calc(100% - 18px);
        margin-top: -34px;
    }

    .intro {
        padding: 24px 16px;
        border-radius: 20px;
        margin-bottom: 17px;
    }

    .intro h2 {
        font-size: 27px;
    }

    .intro p {
        font-size: 15px;
    }

    .cards {
        gap: 15px;
    }

    .certificate-card {
        padding: 18px 16px;
        border-radius: 20px;
        gap: 15px;
    }

    .card-top {
        gap: 14px;
        align-items: flex-start;
    }

    .card-icon {
        width: 62px;
        min-width: 62px;
        height: 62px;
        border-radius: 16px;
        font-size: 29px;
    }

    .badge {
        font-size: 11px;
        padding: 5px 11px;
        margin-bottom: 6px;
    }

    .certificate-info h3 {
        font-size: 20px;
        line-height: 1.18;
    }

    .issuer {
        font-size: 14px;
    }

    .certificate-date {
        font-size: 13px;
    }

    .view-button {
        width: 100%;
        padding: 13px;
        font-size: 15px;
    }
}
</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Rahul Adinath Gaikwad</h1>

    <p>
        Certifications & Professional Development
    </p>

    <div class="header-line"></div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <section class="intro">

        <h2>My Certifications</h2>

        <p>
            A collection of my professional
            learning achievements
        </p>

    </section>



    <section class="cards">


        <!-- =========================
             HTML CERTIFICATE
        ========================= -->

        <div class="certificate-card">

            <div class="card-top">

                <div class="card-icon">
                    📜
                </div>

                <div class="certificate-info">

                    <span class="badge">
                        CERTIFICATE
                    </span>

                    <h3>
                        HTML – Certificate of Completion
                    </h3>

                    <div class="issuer">
                        A2Z IT HUB PVT LTD
                    </div>

                    <div class="certificate-date">
                        HTML · 17 May 2025
                    </div>

                </div>

            </div>


            <button
                class="view-button"
                onclick="openPDF(
                    'Rahul-Adinath-Gaikwad-HTML-Certificate.pdf',
                    'HTML – Certificate'
                )">

                View Certificate →

            </button>

        </div>



        <!-- =========================
             RESUME
        ========================= -->

        <div class="certificate-card">

            <div class="card-top">

                <div class="card-icon resume-icon">
                    📄
                </div>

                <div class="certificate-info">

                    <span class="badge document">
                        DOCUMENT
                    </span>

                    <h3>
                        My Resume
                    </h3>

                    <div class="issuer">
                        Resume
                    </div>

                    <div class="certificate-date">
                        Updated Resume
                    </div>

                </div>

            </div>


            <button
                class="view-button"
                onclick="openPDF(
                    'resume.pdf',
                    'My Resume'
                )">

                View Resume →

            </button>

        </div>


    </section>

</main>



<!-- =========================
     PDF VIEWER
========================= -->

<div id="viewer" class="viewer">

    <div class="viewer-header">

        <div
            id="viewerTitle"
            class="viewer-title">
            Document
        </div>


        <button
            class="close-button"
            onclick="closePDF()">

            ×

        </button>

    </div>


    <iframe
        id="pdfViewer"
        src=""
        title="PDF Viewer">
    </iframe>

</div>



<script>

/* =========================
   OPEN PDF
========================= */

function openPDF(pdf, title) {

    document.getElementById("viewerTitle").innerText = title;

    /*
       Create the full GitHub Pages PDF URL.
    */

    const pdfURL =
        new URL(pdf, window.location.href).href;


    /*
       Google Docs embedded viewer
       prevents Android Chrome from showing
       the ugly "resume.pdf / Open" fallback.
    */

    const viewerURL =
        "https://docs.google.com/gview?embedded=1&url="
        + encodeURIComponent(pdfURL);


    document.getElementById("pdfViewer").src = viewerURL;

    document.getElementById("viewer").classList.add("active");

    document.body.style.overflow = "hidden";
}



/* =========================
   CLOSE PDF
========================= */

function closePDF() {

    document.getElementById("viewer").classList.remove("active");

    document.getElementById("pdfViewer").src = "";

    document.body.style.overflow = "auto";
}



/* =========================
   ESC KEY
========================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closePDF();

    }

});

</script>


</body>
</html>
