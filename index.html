<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahul Adinath Gaikwad | Certifications</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            padding: 55px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
            color: #dbeafe;
        }

        /* Main */
        .container {
            max-width: 950px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #6b7280;
        }

        /* Certificate Card */
        .certificate-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .certificate-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.12);
        }

        .certificate-preview {
            background: #eef2ff;
            padding: 30px;
            text-align: center;
        }

        .certificate-preview span {
            font-size: 65px;
        }

        .certificate-info {
            padding: 30px;
        }

        .certificate-info h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .issuer {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .detail {
            background: #f9fafb;
            padding: 12px 16px;
            border-radius: 10px;
        }

        .detail strong {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .detail span {
            font-weight: bold;
        }

        /* Button */
        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 9px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #1d4ed8;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .container {
                margin: 35px auto;
            }

            .certificate-info {
                padding: 22px;
            }

            .certificate-info h3 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Rahul Adinath Gaikwad</h1>
        <p>Certifications & Professional Development</p>
    </header>

    <main class="container">

        <div class="section-title">
            <h2>My Certifications</h2>
            <p>A collection of my professional learning achievements</p>
        </div>

        <div class="certificate-card">

            <div class="certificate-preview">
                <span>🏆</span>
            </div>

            <div class="certificate-info">

                <h3>HTML – Certificate of Completion</h3>

                <div class="issuer">
                    A2Z IT HUB PVT LTD
                </div>

                <div class="details">

                    <div class="detail">
                        <strong>COURSE</strong>
                        <span>HTML</span>
                    </div>

                    <div class="detail">
                        <strong>ISSUED</strong>
                        <span>17 May 2025</span>
                    </div>

                </div>

                <a
                    class="button"
                    href="Rahul-Adinath-Gaikwad-HTML-Certificate.pdf"
                    target="_blank">
                    View Certificate →
                </a>

            </div>

        </div>

    </main>

    <footer>
        © 2025 Rahul Adinath Gaikwad · Certificate Portfolio
    </footer>

</body>
</html>
